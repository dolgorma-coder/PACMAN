[project]
name = "pacman"
version = "1.0.0"
   authors = [{ name = "dzhambal" }, { name = "jaatif-a" }]

description = "Pac-Man game developed for the 42 cursus."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pygame>=2.6.0",
    "mazegenerator",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "flake8>=7.1",
    "mypy>=1.11",
    "pyinstaller>=6.10"
]

[tool.uv]
find-links = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

exclude = [
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
]